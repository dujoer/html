<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>访问统计 · 工具箱数据中心</title>
<meta name="description" content="工具箱本地访问统计：访问热力图、工具使用排行、成就徽章。所有数据仅保存在你自己的浏览器。" />
<style>
  html{overflow-x:hidden;-webkit-text-size-adjust:100%}
  :root{
    --bg:#f5f5f7; --bg-2:#ececf0;
    --card:#ffffff; --card-2:#fbfbfd;
    --text:#1d1d1f; --muted:#6e6e73; --faint:#8e8e93;
    --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.05);
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
    --shadow-lg:0 4px 12px rgba(0,0,0,.08),0 18px 48px rgba(0,0,0,.12);
    --accent:#0071e3;
    --grad:linear-gradient(135deg,#0a84ff,#5e5ce6);
    --radius:22px; --radius-sm:13px;
    --header-bg:rgba(245,245,247,.72);
  }
  html[data-theme="dark"]{
    --bg:#000000; --bg-2:#0a0a0c;
    --card:#1c1c1e; --card-2:#242426;
    --text:#f5f5f7; --muted:#a1a1a6; --faint:#6e6e73;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    --shadow-lg:0 6px 16px rgba(0,0,0,.5),0 22px 60px rgba(0,0,0,.6);
    --header-bg:rgba(0,0,0,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; line-height:1.5; min-height:100%;
    background-image:radial-gradient(1200px 600px at 12% -8%,rgba(10,132,255,.10),transparent 60%),
                     radial-gradient(1000px 560px at 100% 0%,rgba(94,92,230,.10),transparent 55%);
    background-attachment:fixed; transition:background-color .4s ease,color .4s ease;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* ===== Header ===== */
  header{position:sticky; top:0; z-index:50; background:var(--header-bg);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line);}
  .bar{max-width:900px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{display:flex; align-items:center; gap:11px; min-width:0;}
  .brand .logo{width:34px; height:34px; border-radius:10px; flex:0 0 auto; background:var(--grad); display:grid; place-items:center; box-shadow:0 4px 14px rgba(10,132,255,.35);}
  .brand .logo svg{width:19px;height:19px;}
  .brand h1{font-size:16px; font-weight:600; letter-spacing:.2px; white-space:nowrap;}
  .brand .sub{font-size:11.5px; color:var(--muted); font-weight:500;}
  .head-actions{display:flex; align-items:center; gap:10px;}
  .ghost-btn{display:inline-flex; align-items:center; gap:7px; padding:8px 13px; border-radius:999px; font-size:13px; font-weight:550;
    background:var(--card); border:1px solid var(--line); color:var(--text); transition:transform .15s ease,box-shadow .2s ease,background .2s ease;}
  .ghost-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
  .ghost-btn svg{width:15px;height:15px;}
  .theme-toggle{width:38px;height:38px;padding:0;justify-content:center;border-radius:999px;}
  .theme-toggle .sun{display:none;}
  html[data-theme="dark"] .theme-toggle .sun{display:block;}
  html[data-theme="dark"] .theme-toggle .moon{display:none;}

  .wrap{max-width:900px; margin:0 auto; padding:30px 18px 60px;}

  /* ===== 统计卡片 ===== */
  .stats-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow-lg); padding:22px 24px; color:var(--text); margin-bottom:22px; }
  .stats-head{ display:flex; align-items:center; justify-content:space-between; }
  .stats-head h3{ font-size:19px; font-weight:700; }
  #statsClose{ width:34px; height:34px; border-radius:50%; background:var(--bg-2); font-size:16px; color:var(--text); display:grid; place-items:center; }
  #statsClose:hover{ background:var(--line); }
  .welcome{ margin:12px 0 18px; padding:12px 14px; border-radius:14px; background:color-mix(in srgb,var(--accent) 10%,transparent); color:var(--text); font-size:14.5px; font-weight:600; line-height:1.5; }
  .bigstats{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .bigstat{ background:var(--card-2); border:1px solid var(--line); border-radius:14px; padding:14px 8px; text-align:center; }
  .bigstat .num{ font-size:24px; font-weight:800; background:var(--grad); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .bigstat .lbl{ font-size:12px; color:var(--muted); margin-top:3px; }
  .section{ margin-bottom:18px; }
  .section h4{ font-size:14px; font-weight:700; margin-bottom:10px; }
  .heatmap{ display:flex; gap:3px; overflow-x:auto; padding-bottom:6px; }
  .hm-week{ display:flex; flex-direction:column; gap:3px; }
  .hm-cell{ width:11px; height:11px; border-radius:3px; background:var(--line-2); flex:0 0 auto; }
  .hm-cell.lvl-1{ background:color-mix(in srgb,var(--accent) 30%,transparent); }
  .hm-cell.lvl-2{ background:color-mix(in srgb,var(--accent) 55%,transparent); }
  .hm-cell.lvl-3{ background:color-mix(in srgb,var(--accent) 78%,transparent); }
  .hm-cell.lvl-4{ background:var(--accent); }
  .hm-legend{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); margin-top:6px; }
  .hm-legend .dot{ width:11px; height:11px; border-radius:3px; display:inline-block; background:var(--line-2); }
  .hm-legend .dot.lvl-1{ background:color-mix(in srgb,var(--accent) 30%,transparent); }
  .hm-legend .dot.lvl-2{ background:color-mix(in srgb,var(--accent) 55%,transparent); }
  .hm-legend .dot.lvl-3{ background:color-mix(in srgb,var(--accent) 78%,transparent); }
  .hm-legend .dot.lvl-4{ background:var(--accent); }
  .rank-item{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .rank-name{ width:128px; flex:0 0 auto; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-bar{ flex:1; height:10px; border-radius:999px; background:var(--bg-2); overflow:hidden; }
  .rank-fill{ height:100%; border-radius:999px; background:var(--grad); }
  .rank-cnt{ width:42px; flex:0 0 auto; text-align:right; font-size:12.5px; font-weight:700; color:var(--muted); }
  .badge-wall{ display:flex; flex-wrap:wrap; gap:8px; }
  .badge{ display:inline-flex; flex-direction:column; align-items:center; gap:4px; width:84px; padding:10px 6px; border-radius:14px; background:var(--card-2); border:1px solid var(--line); text-align:center; }
  .badge .bi{ font-size:26px; line-height:1; }
  .badge .bn{ font-size:11.5px; font-weight:650; }
  .badge.locked{ opacity:.38; filter:grayscale(1); }
  .priv-note{ font-size:12px; color:var(--muted); text-align:center; margin-top:6px; }
  .stats-actions{ text-align:center; margin-top:14px; }
  #resetStats{ padding:9px 18px; border-radius:999px; font-size:13px; font-weight:600; background:var(--card); border:1px solid var(--line); color:var(--muted); transition:color .2s,border-color .2s; }
  #resetStats:hover{ color:#ff453a; border-color:#ff453a; }
  @media (max-width:560px){
    .bigstats{ grid-template-columns:repeat(2,1fr); }
    .rank-name{ width:92px; }
    .stats-card{ padding:18px 16px; }
    .bar{padding:12px 16px;}
    .brand .sub{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <a class="brand" href="index.html">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg></div>
      <div><h1>访问统计</h1><div class="sub">工具箱数据中心</div></div>
    </a>
    <div class="head-actions">
      <a class="ghost-btn" href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        <span class="lbl">返回工具箱</span>
      </a>
      <button class="ghost-btn theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="stats-card" role="region" aria-label="访问统计详情">
    <div class="welcome" id="welcomeText"></div>
    <div class="bigstats">
      <div class="bigstat"><div class="num" id="bsOpen">0</div><div class="lbl">累计打开</div></div>
      <div class="bigstat"><div class="num" id="bsStreak">0</div><div class="lbl">连续天数</div></div>
      <div class="bigstat"><div class="num" id="bsDays">0</div><div class="lbl">访问天数</div></div>
      <div class="bigstat"><div class="num" id="bsActive">0</div><div class="lbl">累计停留</div></div>
    </div>
    <div class="section">
      <h4>🗓️ 访问热力图 <span style="font-weight:400;color:var(--muted);font-size:12px">（最近 17 周）</span></h4>
      <div class="heatmap" id="heatmap"></div>
      <div class="hm-legend">少 <span class="dot lvl-1"></span><span class="dot lvl-2"></span><span class="dot lvl-3"></span><span class="dot lvl-4"></span> 多</div>
    </div>
    <div class="section"><h4>🏆 工具使用排行</h4><div id="rankList"></div></div>
    <div class="section"><h4>🎖️ 成就徽章</h4><div class="badge-wall" id="badgeWall"></div></div>
    <div class="priv-note">🔒 所有数据仅保存在你的浏览器本地，不会上传任何服务器。本页仅供查看，数据由工具箱首页记录。</div>
    <div class="stats-actions"><button id="resetStats">重置统计</button></div>
  </div>
</div>

<script>
/* ===================== 工具箱访问统计（详情页，只读，数据由 index.html 记录） ===================== */
const STAT_KEY = "idx-visits-v1";

/* 精简 TOOLS（仅需 id / title / cat），与 index.html 保持同步 */
const TOOLS = [
  {id:"image-editor",  title:"图片压缩裁剪编辑器", cat:"image"},
  {id:"watermark-tool", title:"图片水印工具",       cat:"image"},
  {id:"color-toolkit",  title:"取色器与配色工具箱", cat:"design"},
  {id:"unit-converter", title:"全能单位换算工具箱", cat:"prod"},
  {id:"timer-tool",     title:"多功能计时器",       cat:"prod"},
  {id:"json",           title:"JSON 格式化校验",    cat:"prod"},
  {id:"password",       title:"高强度密码生成器",   cat:"security"},
  {id:"pdf-unlock",     title:"PDF 密码恢复器",     cat:"security"},
  {id:"lottery-system", title:"可配置抽奖系统",     cat:"ops"},
  {id:"long",           title:"长视频文字摘要辅助", cat:"ai"},
  {id:"rmb",            title:"人民币大小写转换",   cat:"finance"},
  {id:"fx",             title:"实时汇率换算",       cat:"finance"},
  {id:"mainforce",      title:"主力成本多线共振测算", cat:"finance"},
  {id:"html2exe",       title:"HTML 转 EXE 打包",   cat:"tooling"},
  {id:"pinyin",         title:"汉字拼音标注工具",   cat:"edu"},
  {id:"pomodoro",       title:"番茄专注计时器",     cat:"prod"},
  {id:"gpu",            title:"显卡性能天梯图",     cat:"hw"},
  {id:"camera",         title:"相机性能天梯图",     cat:"hw"},
  {id:"cpu",            title:"CPU 性能天梯图",      cat:"hw"},
  {id:"phone",          title:"手机性能天梯图",      cat:"hw"},
  {id:"tablet",         title:"平板性能天梯图",      cat:"hw"},
  {id:"handheld",       title:"游戏掌机对比",        cat:"hw"},
  {id:"ssd",            title:"SSD 固态硬盘天梯图",  cat:"hw"}
];
const CATEGORIES = { image:1, design:1, prod:1, security:1, ops:1, ai:1, finance:1, tooling:1, edu:1 };

const $ = (s)=>document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function p2(n){ return n<10 ? "0"+n : ""+n; }
function dayKey(d){ const x=new Date(d); return x.getFullYear()+"-"+p2(x.getMonth()+1)+"-"+p2(x.getDate()); }
function loadStats(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(STAT_KEY)||"{}"); }catch(e){ d={}; }
  return Object.assign({ firstAt:0, openCount:0, days:{}, toolClicks:{}, lastAt:0, totalActiveMs:0, night:false, morning:false }, d);
}
function saveStats(){ try{ localStorage.setItem(STAT_KEY, JSON.stringify(V)); }catch(e){} }
function streak(){
  let s=0; const d=new Date(); d.setHours(0,0,0,0);
  if(!V.days[dayKey(d)]) d.setDate(d.getDate()-1);
  while(V.days[dayKey(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function fmtDur(ms){
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if(h>0) return h+" 时 "+(m>0?m+" 分":"");
  if(m>0) return m+" 分";
  return Math.floor(s)+" 秒";
}

const V = loadStats();
let sessStart = Date.now();
function activeMs(){ return V.totalActiveMs + (Date.now()-sessStart); }

function renderHeatmap(){
  const hm=$("#heatmap"); if(!hm) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const cols=17, total=7*cols;
  const start=new Date(today); start.setDate(today.getDate()-(total-1));
  const first=new Date(start); first.setDate(start.getDate()-first.getDay());
  let cur=new Date(first); let html="";
  const wk=["日","一","二","三","四","五","六"];
  for(let c=0;c<cols;c++){
    html+='<div class="hm-week">';
    for(let r=0;r<7;r++){
      const d=new Date(cur), key=dayKey(d), cnt=V.days[key]||0;
      const lv=cnt<=0?0:cnt===1?1:cnt<=3?2:cnt<=6?3:4;
      const future=d>today;
      const label=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日 周"+wk[d.getDay()]+" · 访问 "+cnt+" 次";
      html+='<div class="hm-cell'+(lv?' lvl-'+lv:'')+'"'+(future?' style="visibility:hidden"':' title="'+label+'"')+'></div>';
      cur.setDate(cur.getDate()+1);
    }
    html+='</div>';
  }
  hm.innerHTML=html;
}
function renderRank(){
  const el=$("#rankList"); if(!el) return;
  const entries=Object.entries(V.toolClicks).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ el.innerHTML='<div style="color:var(--muted);font-size:13px">还没有使用过任何工具，去首页点几个试试吧～</div>'; return; }
  const max=entries[0][1];
  el.innerHTML=entries.map(([id,c])=>{
    const t=TOOLS.find(x=>x.id===id), name=t?t.title:id, pct=Math.max(8,Math.round(c/max*100));
    return '<div class="rank-item"><div class="rank-name" title="'+esc(name)+'">'+esc(name)+'</div><div class="rank-bar"><div class="rank-fill" style="width:'+pct+'%"></div></div><div class="rank-cnt">'+c+'</div></div>';
  }).join("");
}
function renderBadges(){
  const el=$("#badgeWall"); if(!el) return;
  const usedTools=Object.keys(V.toolClicks).filter(k=>V.toolClicks[k]>0).length;
  const catsUsed=new Set(TOOLS.filter(t=>V.toolClicks[t.id]>0).map(t=>t.cat)).size;
  const dailyMax=Math.max(0,...Object.values(V.days));
  const ym=new Date().getFullYear()+"-"+p2(new Date().getMonth()+1);
  const thisMonth=Object.keys(V.days).filter(k=>k.indexOf(ym)===0).length;
  const B=[
    {icon:"🥚",name:"初次探索",ok:V.openCount>=1},
    {icon:"🔥",name:"连续打卡",ok:streak()>=3,sub:"连续 "+streak()+" 天"},
    {icon:"📅",name:"月度活跃",ok:thisMonth>=10,sub:thisMonth+" 天/月"},
    {icon:"📚",name:"博览群书",ok:usedTools>=8,sub:usedTools+" 个工具"},
    {icon:"🎯",name:"全分类",ok:catsUsed>=Object.keys(CATEGORIES).length,sub:catsUsed+"/"+Object.keys(CATEGORIES).length},
    {icon:"🦉",name:"夜猫子",ok:!!V.night},
    {icon:"🌅",name:"早起鸟",ok:!!V.morning},
    {icon:"🍅",name:"专注达人",ok:(V.toolClicks.pomodoro||0)>0},
    {icon:"⚡",name:"单日狂人",ok:dailyMax>=10,sub:"单日最多 "+dailyMax},
    {icon:"🏆",name:"百次贵宾",ok:V.openCount>=100},
    {icon:"💎",name:"千次传奇",ok:V.openCount>=1000}
  ];
  el.innerHTML=B.map(b=>'<div class="badge'+(b.ok?'':' locked')+'"><div class="bi">'+b.icon+'</div><div class="bn">'+b.name+'</div></div>').join("");
}
function renderBigStats(){
  $("#bsOpen").textContent=V.openCount;
  $("#bsStreak").textContent=streak();
  $("#bsDays").textContent=Object.keys(V.days).length;
  $("#bsActive").textContent=fmtDur(activeMs());
}
function renderWelcome(){
  const t=$("#welcomeText");
  if(V.openCount===0) t.textContent="📭 还没有任何访问记录，回到首页打开工具箱即可开始统计。";
  else if(V.openCount===1) t.textContent="👋 初次见面！欢迎来到你的本地工具箱，所有数据只会保存在你自己的浏览器里。";
  else if(V.openCount>=1000) t.textContent="💎 第 "+V.openCount+" 次光临，千次传奇！你就是工具箱的头号粉丝。";
  else if(V.openCount>=100) t.textContent="🏆 第 "+V.openCount+" 次光临，尊贵的百次贵宾！";
  else if(streak()>=3) t.textContent="🔥 连续 "+streak()+" 天来访，好习惯正在养成！";
  else t.textContent="👋 欢迎回来，这是你第 "+V.openCount+" 次打开工具箱。";
}
function renderAll(){ renderWelcome(); renderBigStats(); renderHeatmap(); renderRank(); renderBadges(); }

/* 主题 */
const root=document.documentElement;
const saved=(function(){ try{ return localStorage.getItem("idx-theme"); }catch(e){ return null; } })();
const prefersDark=window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
root.setAttribute("data-theme", saved || (prefersDark?"dark":"light"));
$("#themeToggle").addEventListener("click",()=>{
  const next=root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",next);
  try{ localStorage.setItem("idx-theme",next); }catch(e){}
});

/* 重置（二次确认） */
let resetArmed=false;
$("#resetStats").addEventListener("click",()=>{
  if(!resetArmed){ resetArmed=true; $("#resetStats").textContent="再次点击确认重置"; setTimeout(()=>{ resetArmed=false; $("#resetStats").textContent="重置统计"; },3000); return; }
  Object.keys(V).forEach(k=>delete V[k]);
  Object.assign(V,{firstAt:0,openCount:0,days:{},toolClicks:{},lastAt:0,totalActiveMs:0,night:false,morning:false});
  saveStats(); resetArmed=false; $("#resetStats").textContent="重置统计";
  sessStart=Date.now();
  renderAll();
});

/* 实时刷新累计停留 */
setInterval(()=>{ $("#bsActive").textContent=fmtDur(activeMs()); }, 1000);

renderAll();
</script>
</body>
</html>
