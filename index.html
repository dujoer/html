<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>工具箱 · 本地实用工具集合</title>
<meta name="description" content="纯前端本地工具集合，零上传、隐私安全，涵盖图片处理、设计、生产力、安全等场景。" />
<style>
  html{overflow-x:hidden;-webkit-text-size-adjust:100%}
  :root{
    --bg:#f5f5f7; --bg-2:#ececf0;
    --card:#ffffff; --card-2:#fbfbfd;
    --text:#1d1d1f; --muted:#6e6e73; --faint:#8e8e93;
    --line:rgba(0,0,0,.08); --line-2:rgba(0,0,0,.05);
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
    --shadow-lg:0 4px 12px rgba(0,0,0,.08),0 18px 48px rgba(0,0,0,.12);
    --accent:#0071e3; --accent-2:#5e5ce6;
    --grad:linear-gradient(135deg,#0a84ff,#5e5ce6);
    --radius:22px; --radius-sm:13px;
    --header-bg:rgba(245,245,247,.72);
  }
  html[data-theme="dark"]{
    --bg:#000000; --bg-2:#0a0a0c;
    --card:#1c1c1e; --card-2:#242426;
    --text:#f5f5f7; --muted:#a1a1a6; --faint:#6e6e73;
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.06);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);
    --shadow-lg:0 6px 16px rgba(0,0,0,.5),0 22px 60px rgba(0,0,0,.6);
    --header-bg:rgba(0,0,0,.62);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    line-height:1.5; min-height:100%;
    background-image:radial-gradient(1200px 600px at 12% -8%,rgba(10,132,255,.10),transparent 60%),
                     radial-gradient(1000px 560px at 100% 0%,rgba(94,92,230,.10),transparent 55%);
    background-attachment:fixed;
    transition:background-color .4s ease,color .4s ease;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:50;
    background:var(--header-bg);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line);
  }
  .bar{
    max-width:1140px; margin:0 auto; padding:14px 24px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:0;}
  .brand .logo{
    width:34px; height:34px; border-radius:10px; flex:0 0 auto;
    background:var(--grad); display:grid; place-items:center;
    box-shadow:0 4px 14px rgba(10,132,255,.35);
  }
  .brand .logo svg{width:19px;height:19px;}
  .brand h1{font-size:16px; font-weight:600; letter-spacing:.2px; white-space:nowrap;}
  .brand .sub{font-size:11.5px; color:var(--muted); font-weight:500; white-space:nowrap;}
  .head-actions{display:flex; align-items:center; gap:10px;}
  .ghost-btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:8px 13px; border-radius:999px; font-size:13px; font-weight:550;
    background:var(--card); border:1px solid var(--line); color:var(--text);
    transition:transform .15s ease,box-shadow .2s ease,background .2s ease;
  }
  .ghost-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow);}
  .ghost-btn svg{width:15px;height:15px;}
  .theme-toggle{width:38px;height:38px;padding:0;justify-content:center;border-radius:999px;}
  .theme-toggle .sun{display:none;}
  html[data-theme="dark"] .theme-toggle .sun{display:block;}
  html[data-theme="dark"] .theme-toggle .moon{display:none;}

  /* ===== Hero ===== */
  .hero{max-width:1140px; margin:0 auto; padding:64px 24px 30px; text-align:center;}
  .eyebrow{
    display:inline-block; font-size:12.5px; font-weight:650; letter-spacing:.10em; text-transform:uppercase;
    color:var(--accent); background:color-mix(in srgb,var(--accent) 12%,transparent);
    padding:5px 13px; border-radius:999px; margin-bottom:20px;
  }
  .hero h2{
    font-size:clamp(34px,6vw,56px); font-weight:700; letter-spacing:-.02em; line-height:1.05;
    background:linear-gradient(180deg,var(--text),color-mix(in srgb,var(--text) 62%,var(--muted)));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .hero p.lead{margin:18px auto 0; max-width:560px; font-size:clamp(15px,2.4vw,18px); color:var(--muted);}
  .stats{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:26px;}
  .stat{
    display:inline-flex; align-items:center; gap:8px; padding:8px 15px; border-radius:999px;
    background:var(--card); border:1px solid var(--line); font-size:13px; color:var(--muted); font-weight:550;
  }
  .stat b{color:var(--text); font-weight:700;}
  .stat svg{width:14px;height:14px;color:var(--accent);}

  /* ===== Search ===== */
  .search-wrap{max-width:620px; margin:34px auto 0; position:relative;}
  .search-wrap svg.s-ico{position:absolute; left:18px; top:50%; transform:translateY(-50%); width:18px;height:18px;color:var(--faint);pointer-events:none;}
  #search{
    width:100%; padding:15px 18px 15px 50px; font-size:15.5px;
    border-radius:16px; border:1px solid var(--line); background:var(--card); color:var(--text);
    box-shadow:var(--shadow); transition:box-shadow .2s ease,border-color .2s ease;
    outline:none;
  }
  #search::placeholder{color:var(--faint);}
  #search:focus{border-color:color-mix(in srgb,var(--accent) 55%,transparent); box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent),var(--shadow);}
  #clearSearch{position:absolute; right:12px; top:50%; transform:translateY(-50%); width:26px;height:26px; border-radius:50%; display:none; place-items:center; color:var(--faint); background:var(--bg-2);}
  #clearSearch.show{display:grid;}
  #clearSearch:hover{color:var(--text);}
  #clearSearch svg{width:14px;height:14px;}

  /* ===== Filters ===== */
  .filters{max-width:1140px; margin:30px auto 0; padding:0 24px; display:flex; gap:9px; flex-wrap:wrap; justify-content:center;}
  .pill{
    padding:9px 16px; border-radius:999px; font-size:13.5px; font-weight:600;
    background:var(--card); border:1px solid var(--line); color:var(--muted);
    transition:all .18s ease; white-space:nowrap;
  }
  .pill:hover{color:var(--text); border-color:color-mix(in srgb,var(--accent) 40%,transparent);}
  .pill.on{color:#fff; background:var(--grad); border-color:transparent; box-shadow:0 6px 18px rgba(10,132,255,.35);}

  /* ===== Grid ===== */
  main{max-width:1140px; margin:30px auto 0; padding:0 24px 60px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:20px;}
  .card{
    position:relative; display:flex; flex-direction:column; gap:14px;
    padding:22px; border-radius:var(--radius); background:var(--card);
    border:1px solid var(--line); box-shadow:var(--shadow);
    transition:transform .22s cubic-bezier(.2,.7,.3,1),box-shadow .22s ease,border-color .22s ease;
    overflow:hidden;
  }
  .card::before{content:""; position:absolute; inset:0; border-radius:inherit; padding:1px;
    background:var(--grad); -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; opacity:0; transition:opacity .25s ease; pointer-events:none;}
  .card:hover{transform:translateY(-6px); box-shadow:var(--shadow-lg);}
  .card:hover::before{opacity:1;}
  .card .icon{
    width:54px; height:54px; border-radius:15px; display:grid; place-items:center; flex:0 0 auto;
    box-shadow:0 8px 20px rgba(0,0,0,.16); transition:transform .25s ease;
  }
  .card:hover .icon{transform:scale(1.06) rotate(-2deg);}
  .card .icon svg{width:27px;height:27px;}
  .card h3{font-size:17px; font-weight:650; letter-spacing:-.01em;}
  .card .desc{font-size:13.5px; color:var(--muted); flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:2px;}
  .tag{font-size:11.5px; font-weight:600; color:var(--muted); background:var(--bg-2); padding:4px 9px; border-radius:999px; border:1px solid var(--line-2);}
  .open{display:inline-flex; align-items:center; gap:5px; font-size:13.5px; font-weight:650; color:var(--accent); margin-top:2px;}
  .open svg{width:15px;height:15px; transition:transform .2s ease;}
  .card:hover .open svg{transform:translateX(4px);}

  /* placeholder card */
  .card.more{border-style:dashed; background:transparent; box-shadow:none; align-items:center; justify-content:center; text-align:center; color:var(--faint); min-height:210px;}
  .card.more .plus{width:44px;height:44px;border-radius:13px;background:var(--bg-2);display:grid;place-items:center;margin-bottom:8px;}
  .card.more .plus svg{width:22px;height:22px;}
  .card.more h3{color:var(--muted);font-weight:600;}

  /* empty */
  .empty{grid-column:1/-1; text-align:center; padding:70px 20px; color:var(--muted);}
  .empty svg{width:46px;height:46px;opacity:.5;margin-bottom:14px;}
  .empty p{font-size:15px;}
  .empty button{margin-top:16px;}

  /* footer */
  footer{max-width:1140px; margin:0 auto; padding:28px 24px 50px; text-align:center; color:var(--faint); font-size:12.5px; line-height:1.8;}
  footer .priv{display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; background:var(--card); border:1px solid var(--line); color:var(--muted); font-weight:550;}
  footer .priv svg{width:14px;height:14px;color:#30d158;}

  @media (max-width:640px){
    .bar{padding:12px 16px;}
    .brand .sub{display:none;}
    .hero{padding:44px 18px 22px;}
    main{padding:0 16px 50px;}
    .filters,.hero,.bar{max-width:100%;}
    .grid{grid-template-columns:1fr; gap:16px;}
    .ghost-btn span.lbl{display:none;}
    .ghost-btn{padding:9px;}
  }

  /* ===== 访问统计（基础公开数据 + 入口） ===== */
  .stats-fab{
    position:fixed; right:18px; bottom:18px; z-index:60;
    width:52px; height:52px; border-radius:50%;
    background:var(--grad); color:#fff; font-size:24px;
    display:grid; place-items:center; text-decoration:none;
    box-shadow:0 8px 24px rgba(10,132,255,.4);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .stats-fab:hover{ transform:scale(1.08) rotate(8deg); box-shadow:0 12px 32px rgba(10,132,255,.5); }
  .stats-fab:active{ transform:scale(.96); }
  .data-foot{ text-align:center; margin-top:18px; font-size:14px; }
  .data-foot a{ color:var(--accent); font-weight:600; text-decoration:none; }
  .data-foot a:hover{ text-decoration:underline; }
  @media (max-width:560px){ .stats-fab{ right:14px; bottom:14px; } }
</style>
</head>

<script>
/* ============================================================
 *  工具集合配置 —— 新增工具只需在 TOOLS 数组追加一项即可
 *  ----------------------------------------------------------
 *  id   : 唯一标识（同时用于 GLYPHS 图标查找，可留空用分类图标）
 *  file : 工具 html 文件名（与本索引页同目录）
 *  title: 工具名称
 *  desc : 一句话简介
 *  tags : 标签数组（用于搜索）
 *  cat  : 分类键，必须存在于下方 CATEGORIES
 * ============================================================ */
const CATEGORIES = {
  image:    { label:"图片处理", grad:"linear-gradient(135deg,#ff375f,#ff9f0a)" },
  design:   { label:"设计创意", grad:"linear-gradient(135deg,#bf5af2,#7b5cff)" },
  prod:     { label:"生产力",   grad:"linear-gradient(135deg,#0a84ff,#5ac8fa)" },
  security: { label:"安全隐私", grad:"linear-gradient(135deg,#ff453a,#ff7a45)" },
  ops:      { label:"活动运营", grad:"linear-gradient(135deg,#30d158,#00c7be)" },
  ai:       { label:"AI 辅助",  grad:"linear-gradient(135deg,#0ad1c8,#3b82f6)" },
  finance:  { label:"财务工具", grad:"linear-gradient(135deg,#0e9d72,#15b8a6)" },
  tooling:  { label:"实用工具", grad:"linear-gradient(135deg,#ff9f0a,#ff5e3a)" },
  edu:      { label:"教育学习", grad:"linear-gradient(135deg,#ff2d55,#ff9500)" },
  game:     { label:"休闲游戏", grad:"linear-gradient(135deg,#ff9f0a,#ff375f)" },
};

const TOOLS = [
  { id:"image-editor",  file:"image-editor.html",  title:"图片压缩裁剪编辑器", cat:"image",
    desc:"压缩 · 裁剪 · 旋转 · 批量导出，纯本地 Canvas 处理，不上传。", tags:["压缩","裁剪","批量","图片"] },
  { id:"watermark-tool",file:"watermark-tool.html",title:"图片水印工具",       cat:"image",
    desc:"文字与斜向平铺防盗水印，导出保持原图分辨率。", tags:["水印","防盗","平铺","图片"] },
  { id:"color-toolkit", file:"color-toolkit.html",  title:"取色器与配色工具箱", cat:"design",
    desc:"屏幕取色、配色方案生成，HEX/RGB/HSL 互转。", tags:["取色","配色","调色","颜色"] },
  { id:"unit-converter",file:"unit-converter.html", title:"全能单位换算工具箱", cat:"prod",
    desc:"长度/时间/存储等 10 类单位双向同步换算，离线可用。", tags:["换算","单位","离线","历史"] },
  { id:"timer-tool",    file:"timer-tool.html",     title:"多功能计时器",       cat:"prod",
    desc:"秒表 · 倒计时 · 间隔提醒三合一，支持防抖与提醒。", tags:["计时","倒计时","提醒","秒表"] },
  { id:"json",          file:"json.html",           title:"JSON 格式化校验",    cat:"prod",
    desc:"格式化、压缩、语法校验 JSON，本地即时处理。", tags:["JSON","格式化","校验","开发"] },
  { id:"password",      file:"password.html",       title:"高强度密码生成器",   cat:"security",
    desc:"可定制规则生成强密码，离线生成不存储。", tags:["密码","安全","生成","随机"] },
  { id:"lottery-system",file:"lottery-system.html", title:"可配置抽奖系统",     cat:"ops",
    desc:"公平随机抽奖，支持多奖池、中奖查询与导出。", tags:["抽奖","公平","多池","活动"] },
  { id:"long",          file:"long.html",           title:"长视频文字摘要辅助", cat:"ai",
    desc:"辅助提取长视频文字要点并整理成摘要。", tags:["摘要","长视频","整理","AI"] },
  { id:"rmb",           file:"rmb-converter.html",   title:"人民币大小写转换",   cat:"finance",
    desc:"财务规范金额大写双向转换、批量处理与不规范写法提醒。", tags:["人民币","大写","财务","批量"] },
  { id:"fx",            file:"fx.html",              title:"实时汇率换算",       cat:"finance",
    desc:"联网获取最新汇率（USD 基准，含兜底与本地缓存），任意货币交叉换算、固定/锁定某侧货币、一键交换、近 30 天走势图与换算记录；离线可手写汇率兜底，明暗主题自适应。", tags:["汇率","换算","货币","走势","离线","实时"] },
  { id:"html2exe",      file:"html2exe.html",        title:"HTML 转 EXE 打包",   cat:"tooling",

const CAT_GLYPH = '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';

/* ===================== 状态 & 渲染 ===================== */
const state = { q:"", cat:"all" };
const $ = (s)=>document.querySelector(s);
const grid = $("#grid");

function glyphFor(t){ return GLYPHS[t.id] || CAT_GLYPH; }

function renderFilters(){
  const el = $("#filters");
  const cats = Object.keys(CATEGORIES);
  let html = '<button class="pill'+(state.cat==="all"?" on":"")+'" data-cat="all">全部</button>';
  cats.forEach(c=>{
    html += '<button class="pill'+(state.cat===c?" on":"")+'" data-cat="'+c+'">'+CATEGORIES[c].label+'</button>';
  });
  el.innerHTML = html;
  el.querySelectorAll(".pill").forEach(b=>{
    b.addEventListener("click",()=>{ state.cat=b.dataset.cat; render(); });
  });
}

function cardHTML(t){
  const g = CATEGORIES[t.cat] || { label:"工具", grad:"var(--grad)" };
  const tags = t.tags.map(x=>'<span class="tag">'+esc(x)+'</span>').join("");
  return '<a class="card" href="'+esc(t.file)+'" target="_blank" rel="noopener">'
    + '<div class="icon" style="background:'+g.grad+'">'+glyphFor(t)+'</div>'
    + '<div><h3>'+esc(t.title)+'</h3></div>'
    + '<div class="desc">'+esc(t.desc)+'</div>'
    + '<div class="tags">'+tags+'</div>'
    + '<span class="open">打开工具'
    + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>'
    + '</a>';
}

function moreCard(){
  return '<div class="card more">'
    + '<div class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>'
    + '<h3>更多工具即将上线</h3>'
    + '<div class="desc">本索引可随工具增加随时扩展</div>'
    + '</div>';
}

function render(){
  const q = state.q.trim().toLowerCase();
  const list = TOOLS.filter(t=>{
    if(state.cat!=="all" && t.cat!==state.cat) return false;
    if(!q) return true;
    const hay = (t.title+" "+t.desc+" "+t.tags.join(" ")).toLowerCase();
    return hay.indexOf(q)>=0;
  });
  let html = list.map(cardHTML).join("");
  if(state.cat==="all" && !q) html += moreCard();
  if(!list.length){
    html = '<div class="empty">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>'
      + '<p>没有找到匹配「'+esc(state.q)+'」的工具</p>'
      + '<button class="ghost-btn" id="resetFilter">清除筛选</button></div>';
  }
  grid.innerHTML = html;
  const rf = $("#resetFilter");
  if(rf) rf.addEventListener("click",()=>{ state.q=""; state.cat="all"; $("#search").value=""; $("#clearSearch").classList.remove("show"); renderFilters(); render(); });
  renderFilters();
  $("#statCount").textContent = TOOLS.length;
  $("#statCat").textContent = Object.keys(CATEGORIES).length;
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* ===================== 交互 ===================== */
const search = $("#search");
const clearBtn = $("#clearSearch");
let timer=null;
search.addEventListener("input",()=>{
  state.q = search.value;
  clearBtn.classList.toggle("show", search.value.length>0);
  clearTimeout(timer);
  timer = setTimeout(render, 120);
});
clearBtn.addEventListener("click",()=>{ search.value=""; state.q=""; clearBtn.classList.remove("show"); render(); search.focus(); });

document.addEventListener("keydown",(e)=>{
  if(e.key==="/" && document.activeElement!==search){ e.preventDefault(); search.focus(); }
  if(e.key==="Escape" && document.activeElement===search){ search.value=""; state.q=""; clearBtn.classList.remove("show"); render(); search.blur(); }
});

/* 主题 */
const root = document.documentElement;
const saved = (function(){ try{ return localStorage.getItem("idx-theme"); }catch(e){ return null; } })();
const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
root.setAttribute("data-theme", saved || (prefersDark?"dark":"light"));
$("#themeToggle").addEventListener("click",()=>{
  const next = root.getAttribute("data-theme")==="dark"?"light":"dark";
  root.setAttribute("data-theme",next);
  try{ localStorage.setItem("idx-theme",next); }catch(e){}
});

render();

/* ===================== 本地访问统计（纯前端 / 零上传） ===================== */
const STAT_KEY = "idx-visits-v1";
function p2(n){ return n<10 ? "0"+n : ""+n; }
function dayKey(d){ const x=new Date(d); return x.getFullYear()+"-"+p2(x.getMonth()+1)+"-"+p2(x.getDate()); }
function loadStats(){
  let d={}; try{ d=JSON.parse(localStorage.getItem(STAT_KEY)||"{}"); }catch(e){ d={}; }
  return Object.assign({ firstAt:0, openCount:0, days:{}, toolClicks:{}, lastAt:0, totalActiveMs:0, night:false, morning:false }, d);
}
function saveStats(){ try{ localStorage.setItem(STAT_KEY, JSON.stringify(V)); }catch(e){} }
function streak(){
  let s=0; const d=new Date(); d.setHours(0,0,0,0);
  if(!V.days[dayKey(d)]) d.setDate(d.getDate()-1);
  while(V.days[dayKey(d)]){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function fmtDur(ms){
  const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if(h>0) return h+" 时 "+(m>0?m+" 分":"");
  if(m>0) return m+" 分";
  return Math.floor(s)+" 秒";
}

const V = loadStats();
(function recordOpen(){
  const now=Date.now();
  if(!V.firstAt) V.firstAt=now;
  V.openCount++;
  const tk=dayKey(now);
  V.days[tk]=(V.days[tk]||0)+1;
  V.lastAt=now;
  const hr=new Date().getHours();
  if(hr<5) V.night=true;
  if(hr>=5 && hr<11) V.morning=true;
  saveStats();
})();

function recordToolClick(id){ V.toolClicks[id]=(V.toolClicks[id]||0)+1; saveStats(); }

let sessStart=Date.now(), lastActive=Date.now();
function commitActive(){ const now=Date.now(); V.totalActiveMs+=(now-lastActive); lastActive=now; saveStats(); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) commitActive(); else lastActive=Date.now(); });
window.addEventListener("beforeunload", commitActive);


$("#statToday").textContent = V.days[dayKey(Date.now())] || 0;
$("#statOpen").textContent = V.openCount;
grid.addEventListener("click",(e)=>{
  const a=e.target.closest("a.card"); if(!a) return;
  const file=a.getAttribute("href");
  const t=TOOLS.find(x=>x.file===file);
  if(t) recordToolClick(t.id);
});
/* 统计详情入口：悬浮按钮与页脚链接均为 <a href="stats.html">，无需额外事件绑定 */
</script>
