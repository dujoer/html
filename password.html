<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高强度密码生成器</title>
    <style>
        :root {
            --radius-sm: 6px;
            --radius-md: 12px;
            --shadow-card: 0 4px 18px rgba(0, 0, 0, 0.07);
            --bg-color: #f7f8fa;
            --card-bg: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --btn-bg: #ffffff;
            --btn-hover: #f2f3f7;
            --btn-active: #e5e7eb;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-active: #1e40af;
            --pwd-empty: #d1d5db;
            --pwd-weak: #ef4444;
            --pwd-medium: #f59e0b;
            --pwd-strong: #10b981;
            --pwd-max: #059669;
            --danger: #dc2626;
        }

        [data-theme="dark"] {
            --bg-color: #111217;
            --card-bg: #1c1d26;
            --text-primary: #e8ebf2;
            --text-secondary: #9ca3af;
            --border-color: #30323f;
            --btn-bg: #262834;
            --btn-hover: #323442;
            --btn-active: #3a3c4b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 24px 16px;
            min-height: 100vh;
            transition: background 0.32s ease, color 0.32s ease;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height:6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-secondary);
            border-radius: 99px;
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap:12px;
        }
        .header-text h1 {
            font-size: 24px;
            font-weight: 600;
        }
        .header-text p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top:4px;
        }
        .header-actions{
            display:flex;
            gap:8px;
        }
        .theme-btn, .tip-btn {
            padding: 8px 14px;
            border:1px solid var(--border-color);
            background: var(--btn-bg);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition:0.2s;
        }
        .theme-btn:hover, .tip-btn:hover {
            background: var(--btn-hover);
        }
        .theme-btn:active, .tip-btn:active{
            background:var(--btn-active);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding:24px;
            margin-bottom:18px;
            box-shadow: var(--shadow-card);
        }
        .card-title {
            font-size:17px;
            font-weight:600;
            margin-bottom:16px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .pwd-show-box {
            display:flex;
            gap:10px;
            margin-bottom:16px;
            flex-wrap:wrap;
            align-items:center;
        }
        .pwd-input-wrap{
            flex:1;
            min-width:240px;
            position:relative;
        }
        .pwd-input {
            width:100%;
            padding:14px 44px 14px 14px;
            font-size:19px;
            letter-spacing:1px;
            border:1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background:var(--btn-bg);
            color:var(--text-primary);
            outline:none;
            transition:0.2s;
            font-family:Consolas,monospace;
        }
        .pwd-input:focus{
            border-color:var(--primary);
        }
        .eye-btn{
            position:absolute;
            right:10px;
            top:50%;
            transform:translateY(-50%);
            border:none;
            background:transparent;
            color:var(--text-secondary);
            cursor:pointer;
            font-size:18px;
            width:30px;
            height:30px;
        }

        .btn-primary {
            padding:0 18px;
            border:none;
            background:var(--primary);
            color:#fff;
            border-radius: var(--radius-sm);
            cursor:pointer;
            transition:0.2s;
            min-height:46px;
            white-space:nowrap;
        }
        .btn-primary:hover {
            background:var(--primary-hover);
        }
        .btn-primary:active{
            background:var(--primary-active);
        }
        .btn-danger{
            background:var(--danger);
        }
        .btn-danger:hover{
            background:#b91c1c;
        }

        .strength-bar-wrap{
            margin-bottom:8px;
        }
        .strength-bar {
            height:6px;
            width:100%;
            background:var(--pwd-empty);
            border-radius:999px;
            overflow:hidden;
        }
        .strength-progress {
            height:100%;
            width:0%;
            transition:0.3s all;
        }
        .strength-text-row {
            display:flex;
            justify-content:space-between;
            font-size:14px;
            color:var(--text-secondary);
            margin-bottom:22px;
            margin-top:6px;
        }

        .config-label {
            display:block;
            font-size:14px;
            color:var(--text-secondary);
            margin-bottom:8px;
        }
        .length-control {
            display:flex;
            gap:10px;
            align-items:center;
            margin-bottom:18px;
        }
        .length-slider {
            flex:1;
            height:6px;
            -webkit-appearance:none;
            background:var(--border-color);
            border-radius:999px;
        }
        .length-slider::-webkit-slider-thumb {
            -webkit-appearance:none;
            width:16px;
            height:16px;
            border-radius:50%;
            background:var(--primary);
            cursor:pointer;
        }
        .length-input {
            width:66px;
            padding:7px;
            border:1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background:var(--btn-bg);
            color:var(--text-primary);
            text-align:center;
            outline:none;
        }

        .check-group {
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:10px;
            margin-bottom:20px;
        }
        .check-item {
            display:flex;
            align-items:center;
            gap:7px;
            font-size:14px;
            cursor:pointer;
            padding:4px;
            border-radius:4px;
        }
        .check-item:hover{
            background:var(--btn-hover);
        }

        .batch-box{
            display:flex;
            align-items:center;
            gap:8px;
            margin-bottom:16px;
        }
        .batch-box input{
            width:60px;
            padding:6px;
            border:1px solid var(--border-color);
            border-radius:var(--radius-sm);
            background:var(--btn-bg);
            color:var(--text-primary);
            text-align:center;
        }

        .btn-group {
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .btn-normal {
            flex:1;
            min-width:130px;
            padding:12px;
            border:1px solid var(--border-color);
            background:var(--btn-bg);
            color:var(--text-primary);
            border-radius: var(--radius-sm);
            cursor:pointer;
            transition:0.2s;
        }
        .btn-normal:hover {
            background:var(--btn-hover);
        }
        .btn-normal:active{
            background:var(--btn-active);
        }

        .history-header {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:14px;
            flex-wrap:wrap;
            gap:8px;
        }
        .history-operate{
            display:flex;
            gap:14px;
        }
        .history-clear, .export-history {
            font-size:14px;
            color:var(--primary);
            cursor:pointer;
        }
        .history-list {
            display:flex;
            flex-direction:column;
            gap:9px;
            max-height:340px;
            overflow-y:auto;
        }
        .history-item {
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px;
            border:1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background:var(--btn-bg);
        }
        .history-info{
            cursor:pointer;
            overflow:hidden;
        }
        .history-pwd {
            font-family:Consolas,monospace;
            font-size:14px;
            white-space:nowrap;
            overflow:hidden;
            text-overflow:ellipsis;
        }
        .history-time {
            font-size:12px;
            color:var(--text-secondary);
            margin-top:4px;
        }
        .history-tag {
            font-size:12px;
            padding:2px 7px;
            border-radius:999px;
            margin-left:6px;
        }
        .history-btn button {
            font-size:12px;
            padding:5px 10px;
            border:1px solid var(--border-color);
            background:transparent;
            border-radius: var(--radius-sm);
            cursor:pointer;
            color:var(--text-secondary);
            margin-left:6px;
            transition:0.2s;
        }
        .history-btn button:hover{
            background:var(--btn-hover);
        }
        .empty-history {
            text-align:center;
            padding:26px 0;
            color:var(--text-secondary);
            font-size:14px;
        }

        .toast {
            position:fixed;
            bottom:40px;
            left:50%;
            transform:translateX(-50%);
            padding:10px 22px;
            background:rgba(0,0,0,0.78);
            color:#fff;
            border-radius: var(--radius-md);
            font-size:14px;
            opacity:0;
            pointer-events:none;
            transition:opacity 0.3s ease;
            z-index:9999;
        }
        .toast.show {
            opacity:1;
        }

        .modal-mask{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.5);
            display:flex;
            align-items:center;
            justify-content:center;
            z-index:9998;
            opacity:0;
            pointer-events:none;
            transition:0.3s;
        }
        .modal-mask.show{
            opacity:1;
            pointer-events:auto;
        }
        .modal-box{
            width:min(90%,460px);
            background:var(--card-bg);
            border-radius:var(--radius-md);
            padding:24px;
        }
        .modal-box h3{
            margin-bottom:12px;
        }
        .modal-box p{
            font-size:14px;
            color:var(--text-secondary);
            line-height:1.6;
            margin-bottom:16px;
        }
        .modal-close{
            width:100%;
            padding:10px;
            border:none;
            border-radius:var(--radius-sm);
            background:var(--primary);
            color:#fff;
            cursor:pointer;
        }
        /* 用于兜底复制的隐藏文本框 */
        .clipboard-fallback{
            position:absolute;
            left:-9999px;
            opacity:0;
        }

        @media(max-width:640px){
            .pwd-show-box {flex-direction:column;align-items:stretch;}
            .check-group {grid-template-columns:1fr;}
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="header-text">
            <h1>高强度密码生成器</h1>
            <p>本地离线运算，所有数据仅保存在本机浏览器</p>
        </div>
        <div class="header-actions">
            <button class="tip-btn" id="openTip">安全说明</button>
            <button class="theme-btn" id="toggleTheme">切换明暗模式</button>
        </div>
    </header>

    <div class="card">
        <div class="card-title">生成密码</div>
        <div class="pwd-show-box">
            <div class="pwd-input-wrap">
                <input class="pwd-input" id="pwdOutput" readonly placeholder="点击生成密码">
                <button class="eye-btn" id="toggleEye">👁</button>
            </div>
            <button class="btn-primary" id="copyBtn">复制密码</button>
            <button class="btn-primary btn-danger" id="clearBtn">清空</button>
        </div>

        <div class="strength-bar-wrap">
            <div class="strength-bar">
                <div class="strength-progress" id="strengthBar"></div>
            </div>
            <div class="strength-text-row">
                <span>安全等级：<span id="strengthText">无</span></span>
                <span id="strengthDesc">等待生成</span>
            </div>
        </div>

        <label class="config-label">密码长度（4～64）</label>
        <div class="length-control">
            <input type="range" class="length-slider" id="sliderLen" min="4" max="64" value="8">
            <input type="number" class="length-input" id="numLen" min="4" max="64" value="8">
        </div>

        <label class="config-label">字符选项</label>
        <div class="check-group">
            <label class="check-item">
                <input type="checkbox" id="ckUpper" checked>大写 A-Z
            </label>
            <label class="check-item">
                <input type="checkbox" id="ckLower" checked>小写 a-z
            </label>
            <label class="check-item">
                <input type="checkbox" id="ckNum" checked>数字 0-9
            </label>
            <label class="check-item">
                <input type="checkbox" id="ckSym" checked>特殊符号
            </label>
            <label class="check-item">
                <input type="checkbox" id="ckSafe" checked>规避易混淆字符(0/O,1/l)
            </label>
        </div>

        <div class="batch-box">
            <span class="config-label">批量生成数量：</span>
            <input type="number" id="batchCount" min="1" max="20" value="5">
        </div>

        <div class="btn-group">
            <button class="btn-normal" id="btnGen">生成密码</button>
            <button class="btn-normal" id="btnReGen">重新生成</button>
            <button class="btn-normal" id="btnBatch">批量生成并复制</button>
        </div>
    </div>

    <div class="card">
        <div class="history-header">
            <div class="card-title">历史记录</div>
            <div class="history-operate">
                <span class="export-history" id="exportHistory">导出记录</span>
                <span class="history-clear" id="clearHistory">清空全部</span>
            </div>
        </div>
        <div class="history-list" id="historyBox"></div>
    </div>
</div>

<div class="toast" id="toast"></div>
<!-- 兜底复制用隐藏textarea -->
<textarea class="clipboard-fallback" id="fallbackTextarea"></textarea>

<div class="modal-mask" id="tipModal">
    <div class="modal-box">
        <h3>🔒 安全说明</h3>
        <p>1. 本工具完全离线运行，密码生成运算全部在本地浏览器执行，不会将任何密码上传至互联网；<br>
        2. 历史密码、配置参数保存在浏览器本地存储(localStorage)，清除浏览器数据会删除记录；<br>
        3. 直接本地打开HTML文件(file://协议)，浏览器会限制剪贴板权限，复制异常属于正常限制；<br>
        4. 高强度密码推荐组合：大小写字母+数字+特殊符号，长度≥16位。</p>
        <button class="modal-close" id="closeModal">我已知晓</button>
    </div>
</div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

// DOM
const toggleTheme = $("#toggleTheme");
const openTip = $("#openTip");
const tipModal = $("#tipModal");
const closeModal = $("#closeModal");
const fallbackTextarea = $("#fallbackTextarea");

const pwdOutput = $("#pwdOutput");
const toggleEye = $("#toggleEye");
const copyBtn = $("#copyBtn");
const clearBtn = $("#clearBtn");
const strengthBar = $("#strengthBar");
const strengthText = $("#strengthText");
const strengthDesc = $("#strengthDesc");

const sliderLen = $("#sliderLen");
const numLen = $("#numLen");
const ckUpper = $("#ckUpper");
const ckLower = $("#ckLower");
const ckNum = $("#ckNum");
const ckSym = $("#ckSym");
const ckSafe = $("#ckSafe");
const batchCount = $("#batchCount");

const btnGen = $("#btnGen");
const btnReGen = $("#btnReGen");
const btnBatch = $("#btnBatch");

const historyBox = $("#historyBox");
const clearHistory = $("#clearHistory");
const exportHistory = $("#exportHistory");
const toast = $("#toast");

const MAX_HISTORY = 50;
let generatingLock = false; // 防重复点击锁
let pwdVisible = true;

// 字符池
const CHAR_NORMAL = {
    upper:"ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower:"abcdefghijklmnopqrstuvwxyz",
    num:"0123456789",
    sym:"!@#$%^&*_+-=(){}[]"
};
const CHAR_SAFE = {
    upper:"ABCDEFGHIJKLMNPQRSTUVWXYZ",
    lower:"abcdefghijkmnpqrstuvwxyz",
    num:"23456789"
};

// Toast
function showToast(text){
    toast.textContent = text;
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1800);
}

// ==========【核心修复：兼容file://本地文件复制函数】==========
async function copyText(text){
    try {
        // 优先现代剪贴板API
        await navigator.clipboard.writeText(text);
        return true;
    } catch(err) {
        // API失败，启用旧方案兜底
        fallbackTextarea.value = text;
        fallbackTextarea.select();
        const ok = document.execCommand('copy');
        fallbackTextarea.blur();
        return ok;
    }
}

// 安全弹窗
openTip.onclick = ()=>tipModal.classList.add("show");
closeModal.onclick = ()=>tipModal.classList.remove("show");
tipModal.onclick = e=>{
    if(e.target === tipModal) tipModal.classList.remove("show");
}

// 密码显示隐藏切换
toggleEye.onclick = ()=>{
    pwdVisible = !pwdVisible;
    if(pwdVisible){
        pwdOutput.type = "text";
        toggleEye.textContent = "👁";
    }else{
        pwdOutput.type = "password";
        toggleEye.textContent = "🙈";
    }
}

// 主题持久化
function initTheme(){
    try{
        const t = localStorage.getItem("pwdTheme");
        if(t==="dark") document.documentElement.setAttribute("data-theme","dark");
    }catch(e){}
}
toggleTheme.onclick = ()=>{
    const hasDark = document.documentElement.hasAttribute("data-theme");
    if(hasDark){
        document.documentElement.removeAttribute("data-theme");
        localStorage.setItem("pwdTheme","light");
    }else{
        document.documentElement.setAttribute("data-theme","dark");
        localStorage.setItem("pwdTheme","dark");
    }
};
initTheme();

// 配置持久化
function saveConfig(){
    try{
        const cfg = {
            len:numLen.value,
            upper:ckUpper.checked,
            lower:ckLower.checked,
            num:ckNum.checked,
            sym:ckSym.checked,
            safe:ckSafe.checked,
            batch:batchCount.value
        };
        localStorage.setItem("pwdConfig",JSON.stringify(cfg));
    }catch(e){}
}
function loadConfig(){
    try{
        const str = localStorage.getItem("pwdConfig");
        if(!str) return;
        const cfg = JSON.parse(str);
        sliderLen.value = cfg.len;
        numLen.value = cfg.len;
        ckUpper.checked = cfg.upper;
        ckLower.checked = cfg.lower;
        ckNum.checked = cfg.num;
        ckSym.checked = cfg.sym;
        ckSafe.checked = !!cfg.safe;
        batchCount.value = cfg.batch || 5;
    }catch(e){}
}

// 长度双向同步 + 过滤非法值
sliderLen.oninput = ()=>{
    numLen.value = sliderLen.value;
    saveConfig();
};
numLen.onchange = ()=>{
    let v = parseInt(numLen.value)||8;
    v = Math.max(4,Math.min(64,v));
    numLen.value = v;
    sliderLen.value = v;
    saveConfig();
};
batchCount.onchange = ()=>{
    let v = parseInt(batchCount.value)||5;
    v = Math.max(1,Math.min(20,v));
    batchCount.value = v;
    saveConfig();
}
[ckUpper,ckLower,ckNum,ckSym,ckSafe].forEach(el=>el.onchange=saveConfig);

// 校验勾选合法性
function checkSelectValid(){
    if(!ckUpper.checked && !ckLower.checked && !ckNum.checked && !ckSym.checked){
        ckLower.checked = true;
        saveConfig();
        showToast("至少勾选一类字符，已自动开启小写字母");
        return false;
    }
    return true;
}

// 密码学安全随机函数
function secureRandom(max){
    const array = new Uint32Array(1);
    crypto.getRandomValues(array);
    return array[0] % max;
}

// 生成单条密码
function createPassword(){
    if(!checkSelectValid()) return "";
    const len = parseInt(numLen.value);
    const useSafe = ckSafe.checked;
    let pool = "";
    let uPool,lPool,nPool;
    if(useSafe){
        uPool = CHAR_SAFE.upper;
        lPool = CHAR_SAFE.lower;
        nPool = CHAR_SAFE.num;
    }else{
        uPool = CHAR_NORMAL.upper;
        lPool = CHAR_NORMAL.lower;
        nPool = CHAR_NORMAL.num;
    }
    const sPool = CHAR_NORMAL.sym;

    if(ckUpper.checked) pool += uPool;
    if(ckLower.checked) pool += lPool;
    if(ckNum.checked) pool += nPool;
    if(ckSym.checked) pool += sPool;

    let pwdArr = [];
    // 强制每种选中类型至少出现一个
    if(ckUpper.checked) pwdArr.push(uPool[secureRandom(uPool.length)]);
    if(ckLower.checked) pwdArr.push(lPool[secureRandom(lPool.length)]);
    if(ckNum.checked) pwdArr.push(nPool[secureRandom(nPool.length)]);
    if(ckSym.checked) pwdArr.push(sPool[secureRandom(sPool.length)]);

    const remain = len - pwdArr.length;
    if(remain>0){
        for(let i=0;i<remain;i++){
            pwdArr.push(pool[secureRandom(pool.length)]);
        }
    }
    // 安全打乱
    for(let i=pwdArr.length-1;i>0;i--){
        const j = secureRandom(i+1);
        [pwdArr[i],pwdArr[j]] = [pwdArr[j],pwdArr[i]];
    }
    return pwdArr.join("");
}

// 强度评估算法
function getStrengthInfo(pwd){
    if(!pwd) return {level:"无",color:"var(--pwd-empty)",desc:"等待生成",percent:0};
    let score = 0;
    const l = pwd.length;
    const hasU = /[A-Z]/.test(pwd);
    const hasL = /[a-z]/.test(pwd);
    const hasN = /[0-9]/.test(pwd);
    const hasS = /[!@#$%^&*_+\-=(){}[\]]/.test(pwd);

    if(l>=8) score++;
    if(l>=16) score++;
    if(l>=24) score++;
    if(l>=32) score++;
    const typeCnt = [hasU,hasL,hasN,hasS].filter(Boolean).length;
    score += typeCnt;

    let level,color,desc;
    if(score<=2){
        level="弱";color="var(--pwd-weak)";desc="容易被暴力破解，禁止用于重要账号";
    }else if(score<=4){
        level="中";color="var(--pwd-medium)";desc="仅适合普通资讯类网站";
    }else if(score<=6){
        level="强";color="var(--pwd-strong)";desc="安全性良好，大多数互联网账号可用";
    }else{
        level="极高";color="var(--pwd-max)";desc="高安全级别，推荐网银、邮箱、云服务";
    }
    const percent = Math.min(100,score/10*100);
    return {level,color,desc,percent};
}

function updateStrengthUI(pwd){
    const info = getStrengthInfo(pwd);
    strengthBar.style.width = info.percent+"%";
    strengthBar.style.background = info.color;
    strengthText.textContent = info.level;
    strengthDesc.textContent = info.desc;
}

// 历史记录管理
function getHistory(){
    try{
        const raw = localStorage.getItem("pwdHistory");
        return raw ? JSON.parse(raw) : [];
    }catch(e){return [];}
}
function saveHistoryItem(pwd,level){
    const list = getHistory();
    const now = new Date();
    const timeStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    list.unshift({pwd,level,time:timeStr});
    if(list.length>MAX_HISTORY) list.splice(MAX_HISTORY);
    localStorage.setItem("pwdHistory",JSON.stringify(list));
    renderHistory();
}
function renderHistory(){
    const list = getHistory();
    if(list.length===0){
        historyBox.innerHTML = `<div class="empty-history">暂无历史记录</div>`;
        return;
    }
    let html = "";
    list.forEach((item,idx)=>{
        let tagColor;
        if(item.level==="弱") tagColor="var(--pwd-weak)";
        else if(item.level==="中") tagColor="var(--pwd-medium)";
        else if(item.level==="强") tagColor="var(--pwd-strong)";
        else tagColor="var(--pwd-max)";
        html += `
        <div class="history-item">
            <div class="history-info" data-fill="${item.pwd}">
                <div class="history-pwd">${item.pwd}<span class="history-tag" style="background:${tagColor}22;color:${tagColor}">${item.level}</span></div>
                <div class="history-time">${item.time}</div>
            </div>
            <div class="history-btn">
                <button data-copy="${item.pwd}">复制</button>
                <button data-del="${idx}">删除</button>
            </div>
        </div>`;
    });
    historyBox.innerHTML = html;

    // 历史密码点击填充
    $$(".history-info").forEach(block=>{
        block.onclick = ()=>{
            pwdOutput.value = block.dataset.fill;
            updateStrengthUI(block.dataset.fill);
        }
    })
    $$("[data-copy]").forEach(btn=>{
        btn.onclick = async (e)=>{
            e.stopPropagation();
            const success = await copyText(btn.dataset.copy);
            if(success){
                showToast("复制成功");
            }else{
                showToast("复制失败，请手动选中复制");
            }
        };
    });
    $$("[data-del]").forEach(btn=>{
        btn.onclick = (e)=>{
            e.stopPropagation();
            const arr = getHistory();
            arr.splice(Number(btn.dataset.del),1);
            localStorage.setItem("pwdHistory",JSON.stringify(arr));
            renderHistory();
            showToast("已删除");
        };
    });
}

clearHistory.onclick = ()=>{
    localStorage.removeItem("pwdHistory");
    renderHistory();
    showToast("历史记录已清空");
};

// 导出历史记录文本
exportHistory.onclick = async ()=>{
    const list = getHistory();
    if(list.length===0){
        showToast("暂无记录");
        return;
    }
    let text = "密码\t安全等级\t生成时间\n";
    list.forEach(item=>{
        text += `${item.pwd}\t${item.level}\t${item.time}\n`;
    })
    const success = await copyText(text);
    if(success){
        showToast("记录文本已复制，可以粘贴保存");
    }else{
        showToast("复制失败，请手动复制页面内容");
    }
}

// 单条生成
async function genSingle(){
    if(generatingLock) return;
    generatingLock = true;
    const pwd = createPassword();
    if(!pwd){
        generatingLock = false;
        return;
    }
    pwdOutput.value = pwd;
    const info = getStrengthInfo(pwd);
    updateStrengthUI(pwd);
    saveHistoryItem(pwd,info.level);
    showToast("密码生成完成");
    setTimeout(()=>generatingLock=false,300);
}

// 批量生成
async function genBatch(){
    if(generatingLock) return;
    generatingLock = true;
    const count = parseInt(batchCount.value);
    const list = [];
    for(let i=0;i<count;i++){
        list.push(createPassword());
    }
    const text = list.join("\n");
    const success = await copyText(text);
    if(success){
        showToast(`已生成${count}条密码并复制！`);
    }else{
        showToast("复制失败，请手动复制");
    }
    generatingLock = false;
}

btnGen.onclick = genSingle;
btnReGen.onclick = genSingle;
btnBatch.onclick = genBatch;

// 清空按钮
clearBtn.onclick = ()=>{
    pwdOutput.value = "";
    updateStrengthUI("");
}

// 复制按钮
copyBtn.onclick = async ()=>{
    if(!pwdOutput.value){
        showToast("没有密码");
        return;
    }
    const success = await copyText(pwdOutput.value);
    if(success){
        showToast("复制成功");
    }else{
        showToast("复制失败，请手动选中复制");
    }
};

// 快捷键 Enter生成
document.onkeydown = e=>{
    if(e.key === "Enter"){
        genSingle();
    }
}

// 初始化执行
loadConfig();
renderHistory();
updateStrengthUI("");
</script>
